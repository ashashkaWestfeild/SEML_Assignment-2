# flake8 has no pyproject.toml support, so its configuration lives here.
[flake8]
max-line-length = 90
max-complexity = 10
extend-ignore =
    E203,
    W503
exclude =
    .git,
    __pycache__,
    .venv,
    artifacts,
    reports,
    .pytest_cache
per-file-ignores =
    tests/*:E501
# This generator embeds notebook source and markdown tables as string
# literals; wrapping them would corrupt the document it produces.
    scripts/build_submission_notebook.py:E501
